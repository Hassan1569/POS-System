<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCare - Login</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0d6efd;
            --primary-dark: #0b5ed7;
            --success-color: #198754;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --info-color: #0dcaf0;
            --dark-color: #212529;
            --light-bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --border-color: #dee2e6;
            --pharmacy-green: #10b981;
            --pharmacy-blue: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            max-width: 450px;
            width: 100%;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, var(--pharmacy-blue) 0%, var(--pharmacy-green) 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .login-header i {
            font-size: 60px;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .login-header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-body {
            padding: 40px 30px;
        }

        .form-floating {
            margin-bottom: 20px;
        }

        .form-floating label {
            color: var(--text-secondary);
        }

        .form-control {
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--pharmacy-blue);
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.15);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-secondary);
            z-index: 10;
            background: transparent;
            border: none;
            padding: 5px;
        }

        .password-toggle:hover {
            color: var(--pharmacy-blue);
        }

        .form-check {
            margin-bottom: 25px;
        }

        .form-check-input:checked {
            background-color: var(--pharmacy-blue);
            border-color: var(--pharmacy-blue);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--pharmacy-blue) 0%, var(--pharmacy-green) 100%);
            border: none;
            color: white;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .demo-credentials {
            margin-top: 30px;
            padding: 20px;
            background: var(--light-bg);
            border-radius: 10px;
            border-left: 4px solid var(--pharmacy-blue);
        }

        .demo-credentials h6 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .demo-credential-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .demo-credential-item:hover {
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .demo-credential-item:last-child {
            margin-bottom: 0;
        }

        .demo-credential-item strong {
            display: block;
            color: var(--pharmacy-blue);
            margin-bottom: 5px;
        }

        .demo-credential-item small {
            color: var(--text-secondary);
            display: block;
        }

        @media (max-width: 576px) {
            .login-header {
                padding: 30px 20px;
            }

            .login-header h1 {
                font-size: 26px;
            }

            .login-body {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-prescription-bottle-alt"></i>
                <h1>PharmaCare</h1>
                <p>Pharmacy Management System</p>
            </div>
            
            <div class="login-body">
                <form id="loginForm">
                    <div class="form-floating">
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        <label for="email"><i class="fas fa-envelope me-2"></i>Email address</label>
                    </div>
                    
                    <div class="form-floating" style="position: relative;">
                        <input type="password" class="form-control" id="password" placeholder="Password" required>
                        <label for="password"><i class="fas fa-lock me-2"></i>Password</label>
                        <button type="button" class="password-toggle" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">
                            Remember me
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn-login">
                        <i class="fas fa-sign-in-alt me-2"></i>Login
                    </button>
                </form>
                
                <div class="demo-credentials">
                    <h6><i class="fas fa-info-circle"></i> Demo Credentials</h6>
                    <div class="demo-credential-item" onclick="fillCredentials('admin@pharmacy.com', 'admin123')">
                        <strong><i class="fas fa-user-shield me-1"></i> Admin</strong>
                        <small>Email: admin@pharmacy.com</small>
                        <small>Password: admin123</small>
                    </div>
                    <div class="demo-credential-item" onclick="fillCredentials('shopkeeper@pharmacy.com', 'shop123')">
                        <strong><i class="fas fa-cash-register me-1"></i> Shopkeeper</strong>
                        <small>Email: shopkeeper@pharmacy.com</small>
                        <small>Password: shop123</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- PharmaCare Modules (must be loaded before inline script) -->
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    
    <script>
        // Initialize LocalStorage with full default dataset via Storage module
        function initializeApp() {
            if (typeof Storage !== 'undefined' && typeof Storage.init === 'function') {
                Storage.init();
            }
        }

        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Fill credentials function
        function fillCredentials(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
        }

        // Login form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            const users = Storage.get(STORAGE_KEYS.USERS, []);
            const user = users.find(u => u.email === email && u.password === password);
            
            if (user) {
                if (!user.active) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Account Disabled',
                        text: 'Your account has been disabled. Please contact administrator.',
                        confirmButtonColor: '#3b82f6'
                    });
                    return;
                }
                
                // Save current user session
                const currentUser = {
                    id: user.id,
                    name: user.name,
                    email: user.email,
                    role: user.role,
                    phone: user.phone,
                    loginTime: new Date().toISOString(),
                    rememberMe: rememberMe
                };
                
                Storage.set(STORAGE_KEYS.CURRENT_USER, currentUser);
                
                Swal.fire({
                    icon: 'success',
                    title: 'Login Successful',
                    text: `Welcome back, ${user.name}!`,
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = 'dashboard.html';
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Login Failed',
                    text: 'Invalid email or password. Please try again.',
                    confirmButtonColor: '#3b82f6'
                });
            }
        });

        // Initialize app on load
        initializeApp();

        // Check if already logged in
        const currentUser = Storage.get(STORAGE_KEYS.CURRENT_USER, null);
        if (currentUser) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
