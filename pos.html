<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS / Billing - PharmaCare</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <style>
        .pos-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            height: calc(100vh - 200px);
        }
        
        .product-search-section {
            display: flex;
            flex-direction: column;
        }
        
        .cart-section {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            max-height: 100%;
        }
        
        .cart-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        
        .cart-item {
            background: var(--light-bg);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .cart-item-info {
            flex: 1;
        }
        
        .cart-item-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 3px;
        }
        
        .cart-item-details {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .quantity-control button {
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 6px;
        }
        
        .quantity-control input {
            width: 50px;
            text-align: center;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            padding: 5px;
        }
        
        .cart-summary {
            padding: 20px;
            border-top: 2px solid var(--border-color);
            background: var(--light-bg);
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }
        
        .summary-row.total {
            font-size: 18px;
            font-weight: 700;
            padding-top: 12px;
            border-top: 2px solid var(--border-color);
        }
        
        .product-search-results {
            margin-top: 15px;
            max-height: calc(100vh - 350px);
            overflow-y: auto;
        }
        
        .search-result-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .search-result-item:hover {
            border-color: var(--primary-color);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }
        
        .search-result-info h6 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .search-result-info small {
            display: block;
            color: var(--text-secondary);
            font-size: 12px;
        }
        
        .search-result-price {
            text-align: right;
        }
        
        .search-result-price .price {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-color);
        }
        
        .search-result-price .stock {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        @media (max-width: 992px) {
            .pos-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            
            .cart-section {
                max-height: 600px;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-prescription-bottle-alt"></i>
            <span>PharmaCare</span>
        </div>
        <div class="sidebar-menu" id="sidebarMenu"></div>
    </div>

    <div class="main-content">
        <nav class="topbar">
            <button class="btn btn-link sidebar-toggle" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
            
            <div class="topbar-right">
                <div class="dropdown notification-dropdown">
                    <button class="btn btn-link notification-btn" type="button" data-bs-toggle="dropdown">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge" id="notificationBadge">0</span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end notification-menu">
                        <div class="notification-header"><h6>Notifications</h6></div>
                        <div class="notification-list" id="notificationList"></div>
                    </div>
                </div>
                
                <div class="dropdown user-dropdown">
                    <button class="btn btn-link user-btn" type="button" data-bs-toggle="dropdown">
                        <div class="user-avatar"><i class="fas fa-user"></i></div>
                        <div class="user-info">
                            <span class="user-name" id="userName">User</span>
                            <small class="user-role" id="userRole">Role</small>
                        </div>
                        <i class="fas fa-chevron-down ms-2"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="page-content">
            <div class="page-header mb-3">
                <h1><i class="fas fa-cash-register me-2"></i>Point of Sale</h1>
                <p class="text-muted">Search and add products to customer cart</p>
            </div>

            <div class="pos-container">
                <!-- Product Search Section -->
                <div class="product-search-section">
                    <div class="card">
                        <div class="card-body">
                            <div class="input-group input-group-lg">
                                <span class="input-group-text"><i class="fas fa-search"></i></span>
                                <input type="text" class="form-control" id="posSearchInput" 
                                       placeholder="Search by product name, SKU, barcode..." autofocus>
                            </div>
                        </div>
                    </div>
                    
                    <div class="product-search-results" id="searchResults">
                        <div class="text-center text-muted py-5">
                            <i class="fas fa-search fa-3x mb-3 opacity-25"></i>
                            <p>Start typing to search products</p>
                        </div>
                    </div>
                </div>

                <!-- Cart Section -->
                <div class="cart-section">
                    <div class="cart-header">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0"><i class="fas fa-shopping-cart me-2"></i>Customer Cart</h5>
                            <button class="btn btn-sm btn-outline-danger" onclick="clearCart()">
                                <i class="fas fa-trash me-1"></i>Clear
                            </button>
                        </div>
                        
                        <!-- Customer Info -->
                        <div class="mb-2">
                            <input type="text" class="form-control form-control-sm mb-2" id="customerName" 
                                   placeholder="Customer Name (Optional)">
                            <input type="text" class="form-control form-control-sm mb-2" id="customerPhone" 
                                   placeholder="Customer Phone (Optional)">
                            <input type="text" class="form-control form-control-sm mb-2" id="doctorName" 
                                   placeholder="Doctor Name (Optional)">
                            <input type="text" class="form-control form-control-sm" id="prescriptionNumber" 
                                   placeholder="Prescription No. (Optional)">
                        </div>
                    </div>
                    
                    <div class="cart-items" id="cartItems">
                        <div class="empty-state">
                            <i class="fas fa-shopping-cart"></i>
                            <h4>Cart is Empty</h4>
                            <p>Add products to get started</p>
                        </div>
                    </div>
                    
                    <div class="cart-summary">
                        <div class="summary-row">
                            <span>Subtotal:</span>
                            <strong id="subtotal">$0.00</strong>
                        </div>
                        <div class="summary-row">
                            <span>Discount (%):</span>
                            <input type="number" class="form-control form-control-sm" id="discountPercent" 
                                   value="0" min="0" max="100" style="width: 80px;" onchange="updateCartSummary()">
                        </div>
                        <div class="summary-row">
                            <span>Discount Amount:</span>
                            <strong id="discountAmount" class="text-danger">$0.00</strong>
                        </div>
                        <div class="summary-row total">
                            <span>TOTAL:</span>
                            <span class="text-primary" id="grandTotal">$0.00</span>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Payment Method</label>
                            <select class="form-select" id="paymentMethod">
                                <option value="Cash">Cash</option>
                                <option value="Card">Card</option>
                                <option value="Bank Transfer">Bank Transfer</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        
                        <button class="btn btn-primary w-100" onclick="generateBill()" id="generateBillBtn" disabled>
                            <i class="fas fa-receipt me-2"></i>Generate Bill
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Invoice Modal -->
    <div class="modal fade" id="invoiceModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-file-invoice me-2"></i>Invoice Preview</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="invoiceContent">
                    <!-- Invoice will be generated here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-info" onclick="printInvoice()">
                        <i class="fas fa-print me-2"></i>Print
                    </button>
                    <button type="button" class="btn btn-success" onclick="confirmSale()">
                        <i class="fas fa-check me-2"></i>Confirm Sale
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="app.js"></script>
    <script src="pos-scripts.js"></script>
</body>
</html>
