<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - PharmaCare</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-prescription-bottle-alt"></i>
            <span>PharmaCare</span>
        </div>
        <div class="sidebar-menu" id="sidebarMenu"></div>
    </div>

    <div class="main-content">
        <nav class="topbar">
            <button class="btn btn-link sidebar-toggle" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
            
            <div class="topbar-right">
                <div class="dropdown notification-dropdown">
                    <button class="btn btn-link notification-btn" type="button" data-bs-toggle="dropdown">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge" id="notificationBadge">0</span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end notification-menu">
                        <div class="notification-header"><h6>Notifications</h6></div>
                        <div class="notification-list" id="notificationList"></div>
                    </div>
                </div>
                
                <div class="dropdown user-dropdown">
                    <button class="btn btn-link user-btn" type="button" data-bs-toggle="dropdown">
                        <div class="user-avatar"><i class="fas fa-user"></i></div>
                        <div class="user-info">
                            <span class="user-name" id="userName">User</span>
                            <small class="user-role" id="userRole">Role</small>
                        </div>
                        <i class="fas fa-chevron-down ms-2"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="page-content">
            <div class="page-header">
                <h1><i class="fas fa-chart-bar me-2"></i>Reports & Analytics</h1>
                <p class="text-muted">View comprehensive pharmacy reports</p>
            </div>

            <!-- Date Filter -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label">Report Period</label>
                            <select class="form-select" id="reportPeriod" onchange="updateReports()">
                                <option value="today">Today</option>
                                <option value="week">This Week</option>
                                <option value="month" selected>This Month</option>
                                <option value="year">This Year</option>
                                <option value="custom">Custom Range</option>
                            </select>
                        </div>
                        <div class="col-md-3" id="customFromDiv" style="display: none;">
                            <label class="form-label">From Date</label>
                            <input type="date" class="form-control" id="customFrom">
                        </div>
                        <div class="col-md-3" id="customToDiv" style="display: none;">
                            <label class="form-label">To Date</label>
                            <input type="date" class="form-control" id="customTo">
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-primary w-100" onclick="updateReports()">
                                <i class="fas fa-sync me-2"></i>Generate Report
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Summary Cards -->
            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="stats-card stats-success">
                        <div class="stats-icon">
                            <i class="fas fa-dollar-sign"></i>
                        </div>
                        <div class="stats-content">
                            <h3 id="totalRevenue">$0</h3>
                            <p>Total Revenue</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card stats-primary">
                        <div class="stats-icon">
                            <i class="fas fa-shopping-cart"></i>
                        </div>
                        <div class="stats-content">
                            <h3 id="totalSales">0</h3>
                            <p>Total Sales</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card stats-warning">
                        <div class="stats-icon">
                            <i class="fas fa-percentage"></i>
                        </div>
                        <div class="stats-content">
                            <h3 id="avgDiscount">0%</h3>
                            <p>Avg Discount</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card stats-info">
                        <div class="stats-icon">
                            <i class="fas fa-receipt"></i>
                        </div>
                        <div class="stats-content">
                            <h3 id="avgTransaction">$0</h3>
                            <p>Avg Transaction</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Charts -->
            <div class="row g-4 mb-4">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="fas fa-chart-line me-2"></i>Revenue Trend</h5>
                        </div>
                        <div class="card-body">
                            <canvas id="revenueChart" style="height: 300px;"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Top Products -->
            <div class="row g-4 mb-4">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="fas fa-star me-2"></i>Top Selling Products</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-sm">
                                    <thead>
                                        <tr>
                                            <th>Product</th>
                                            <th>Qty Sold</th>
                                            <th>Revenue</th>
                                        </tr>
                                    </thead>
                                    <tbody id="topProductsTable"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="fas fa-credit-card me-2"></i>Payment Methods</h5>
                        </div>
                        <div class="card-body">
                            <canvas id="paymentChart" style="height: 300px;"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="app.js"></script>
    
    <script>
        let revenueChart = null;
        let paymentChart = null;

        document.getElementById('reportPeriod').addEventListener('change', function() {
            const isCustom = this.value === 'custom';
            document.getElementById('customFromDiv').style.display = isCustom ? 'block' : 'none';
            document.getElementById('customToDiv').style.display = isCustom ? 'block' : 'none';
        });

        function getDateRange() {
            const period = document.getElementById('reportPeriod').value;
            const now = new Date();
            let from, to = new Date();
            
            switch(period) {
                case 'today':
                    from = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    break;
                case 'week':
                    from = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                    break;
                case 'month':
                    from = new Date(now.getFullYear(), now.getMonth(), 1);
                    break;
                case 'year':
                    from = new Date(now.getFullYear(), 0, 1);
                    break;
                case 'custom':
                    from = new Date(document.getElementById('customFrom').value);
                    to = new Date(document.getElementById('customTo').value);
                    break;
                default:
                    from = new Date(now.getFullYear(), now.getMonth(), 1);
            }
            
            return { from, to };
        }

        function updateReports() {
            const sales = Storage.get(STORAGE_KEYS.SALES, []);
            const settings = Storage.get(STORAGE_KEYS.SETTINGS, {});
            const currencySymbol = settings.currencySymbol || '$';
            const { from, to } = getDateRange();
            
            // Filter sales by date range
            const filteredSales = sales.filter(sale => {
                const saleDate = new Date(sale.date);
                return saleDate >= from && saleDate <= to;
            });
            
            // Calculate stats
            const totalRevenue = filteredSales.reduce((sum, sale) => sum + sale.grandTotal, 0);
            const totalSales = filteredSales.length;
            const totalDiscount = filteredSales.reduce((sum, sale) => sum + (sale.discountPercent ?? sale.discount ?? 0), 0);
            const avgDiscount = totalSales > 0 ? (totalDiscount / totalSales).toFixed(1) : 0;
            const avgTransaction = totalSales > 0 ? (totalRevenue / totalSales).toFixed(2) : 0;
            
            document.getElementById('totalRevenue').textContent = currencySymbol + totalRevenue.toFixed(2);
            document.getElementById('totalSales').textContent = totalSales;
            document.getElementById('avgDiscount').textContent = avgDiscount + '%';
            document.getElementById('avgTransaction').textContent = currencySymbol + avgTransaction;
            
            // Generate charts
            generateRevenueChart(filteredSales);
            generatePaymentChart(filteredSales);
            generateTopProducts(filteredSales, currencySymbol);
        }

        function generateRevenueChart(sales) {
            const ctx = document.getElementById('revenueChart');
            if (!ctx) return;
            
            if (revenueChart) revenueChart.destroy();
            
            // Group by date
            const dailyRevenue = {};
            sales.forEach(sale => {
                const date = new Date(sale.date).toLocaleDateString();
                dailyRevenue[date] = (dailyRevenue[date] || 0) + sale.grandTotal;
            });
            
            const labels = Object.keys(dailyRevenue).sort();
            const data = labels.map(label => dailyRevenue[label]);
            
            revenueChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Revenue',
                        data: data,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });
        }

        function generatePaymentChart(sales) {
            const ctx = document.getElementById('paymentChart');
            if (!ctx) return;
            
            if (paymentChart) paymentChart.destroy();
            
            const paymentMethods = {};
            sales.forEach(sale => {
                paymentMethods[sale.paymentMethod] = (paymentMethods[sale.paymentMethod] || 0) + 1;
            });
            
            paymentChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(paymentMethods),
                    datasets: [{
                        data: Object.values(paymentMethods),
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        function generateTopProducts(sales, currencySymbol) {
            const productSales = {};
            
            sales.forEach(sale => {
                sale.items.forEach(item => {
                    if (!productSales[item.productName]) {
                        productSales[item.productName] = { quantity: 0, revenue: 0 };
                    }
                    productSales[item.productName].quantity += item.quantity;
                    productSales[item.productName].revenue += Number(item.subtotal ?? item.total ?? 0);
                });
            });
            
            const sortedProducts = Object.entries(productSales)
                .sort((a, b) => b[1].quantity - a[1].quantity)
                .slice(0, 10);
            
            const tbody = document.getElementById('topProductsTable');
            tbody.innerHTML = sortedProducts.map(([name, data]) => `
                <tr>
                    <td>${name}</td>
                    <td><strong>${data.quantity}</strong></td>
                    <td>${currencySymbol}${data.revenue.toFixed(2)}</td>
                </tr>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (!window.location.pathname.includes('reports')) return;
            
            const currentUser = Storage.get(STORAGE_KEYS.CURRENT_USER, {});
            if (currentUser.role !== 'admin') {
                window.location.href = 'dashboard.html';
                return;
            }
            
            setTimeout(updateReports, 100);
        });
    </script>
</body>
</html>
