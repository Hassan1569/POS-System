<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales History - PharmaCare</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-prescription-bottle-alt"></i>
            <span>PharmaCare</span>
        </div>
        <div class="sidebar-menu" id="sidebarMenu"></div>
    </div>

    <div class="main-content">
        <nav class="topbar">
            <button class="btn btn-link sidebar-toggle" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
            
            <div class="topbar-right">
                <div class="dropdown notification-dropdown">
                    <button class="btn btn-link notification-btn" type="button" data-bs-toggle="dropdown">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge" id="notificationBadge">0</span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end notification-menu">
                        <div class="notification-header"><h6>Notifications</h6></div>
                        <div class="notification-list" id="notificationList"></div>
                    </div>
                </div>
                
                <div class="dropdown user-dropdown">
                    <button class="btn btn-link user-btn" type="button" data-bs-toggle="dropdown">
                        <div class="user-avatar"><i class="fas fa-user"></i></div>
                        <div class="user-info">
                            <span class="user-name" id="userName">User</span>
                            <small class="user-role" id="userRole">Role</small>
                        </div>
                        <i class="fas fa-chevron-down ms-2"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="page-content">
            <div class="page-header">
                <div>
                    <h1><i class="fas fa-receipt me-2"></i>Sales History</h1>
                    <p class="text-muted">View and manage all sales transactions</p>
                </div>
            </div>

            <!-- Filters -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Search</label>
                            <input type="text" class="form-control" id="searchSales" 
                                   placeholder="Invoice #, Customer name...">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">From Date</label>
                            <input type="date" class="form-control" id="fromDate">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">To Date</label>
                            <input type="date" class="form-control" id="toDate">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">&nbsp;</label>
                            <button class="btn btn-outline-secondary w-100" onclick="resetSalesFilters()">
                                <i class="fas fa-redo me-2"></i>Reset
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sales Table -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Invoice #</th>
                                    <th>Date</th>
                                    <th>Customer</th>
                                    <th>Cashier</th>
                                    <th>Items</th>
                                    <th>Subtotal</th>
                                    <th>Discount</th>
                                    <th>Total</th>
                                    <th>Payment</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="salesTableBody">
                                <tr>
                                    <td colspan="10" class="text-center">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- View Invoice Modal -->
    <div class="modal fade" id="viewInvoiceModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-file-invoice me-2"></i>Invoice Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="invoiceDetailsBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="printSaleInvoice()">
                        <i class="fas fa-print me-2"></i>Print
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
    
    <script>
        let currentViewingSale = null;

        function loadSales() {
            const sales = JSON.parse(localStorage.getItem('pharmacy_sales') || '[]');
            const settings = JSON.parse(localStorage.getItem('pharmacy_settings') || '{}');
            const currencySymbol = settings.currencySymbol || '$';
            const tbody = document.getElementById('salesTableBody');
            
            const searchTerm = document.getElementById('searchSales')?.value.toLowerCase() || '';
            const fromDate = document.getElementById('fromDate')?.value;
            const toDate = document.getElementById('toDate')?.value;
            
            let filteredSales = sales.filter(sale => {
                const matchesSearch = !searchTerm || 
                    sale.invoiceNumber.toLowerCase().includes(searchTerm) ||
                    sale.customerName.toLowerCase().includes(searchTerm);
                
                let matchesDate = true;
                const saleDate = new Date(sale.date);
                if (fromDate) {
                    matchesDate = matchesDate && saleDate >= new Date(fromDate);
                }
                if (toDate) {
                    const to = new Date(toDate);
                    to.setHours(23, 59, 59);
                    matchesDate = matchesDate && saleDate <= to;
                }
                
                return matchesSearch && matchesDate;
            });
            
            filteredSales.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            if (filteredSales.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="10">
                            <div class="empty-state">
                                <i class="fas fa-receipt"></i>
                                <h4>No Sales Found</h4>
                                <p>No sales match your filter criteria</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = filteredSales.map(sale => {
                const saleDate = new Date(sale.date);
                const itemCount = sale.items.reduce((sum, item) => sum + item.quantity, 0);
                
                return `
                    <tr>
                        <td><strong>${sale.invoiceNumber}</strong></td>
                        <td>${saleDate.toLocaleDateString()}<br><small class="text-muted">${saleDate.toLocaleTimeString()}</small></td>
                        <td>${sale.customerName}<br><small class="text-muted">${sale.customerPhone}</small></td>
                        <td>${sale.cashier}</td>
                        <td>${itemCount} items</td>
                        <td>${currencySymbol}${sale.subtotal.toFixed(2)}</td>
                        <td class="text-danger">${sale.discount}%</td>
                        <td><strong>${currencySymbol}${sale.grandTotal.toFixed(2)}</strong></td>
                        <td><span class="badge badge-info">${sale.paymentMethod}</span></td>
                        <td>
                            <button class="btn btn-sm btn-primary btn-icon" onclick='viewInvoice(${JSON.stringify(sale)})' title="View">
                                <i class="fas fa-eye"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        function viewInvoice(sale) {
            currentViewingSale = sale;
            const settings = JSON.parse(localStorage.getItem('pharmacy_settings') || '{}');
            const currencySymbol = settings.currencySymbol || '$';
            const body = document.getElementById('invoiceDetailsBody');
            const saleDate = new Date(sale.date);
            
            body.innerHTML = `
                <div id="printableSaleInvoice" style="font-family: 'Inter', sans-serif;">
                    <div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 20px; margin-bottom: 20px;">
                        <h2 style="margin: 0; color: #3b82f6; font-size: 32px;">
                            <i class="fas fa-prescription-bottle-alt"></i> ${settings.pharmacyName}
                        </h2>
                        <p style="margin: 5px 0;">${settings.address}</p>
                        <p style="margin: 5px 0;">Phone: ${settings.phone} | Email: ${settings.email}</p>
                    </div>
                    
                    <div style="margin-bottom: 20px;">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div>
                                <strong>Invoice #:</strong> ${sale.invoiceNumber}<br>
                                <strong>Date:</strong> ${saleDate.toLocaleString()}<br>
                                <strong>Cashier:</strong> ${sale.cashier}
                            </div>
                            <div>
                                <strong>Customer:</strong> ${sale.customerName}<br>
                                <strong>Phone:</strong> ${sale.customerPhone}<br>
                                ${sale.doctorName !== '-' ? `<strong>Doctor:</strong> ${sale.doctorName}<br>` : ''}
                                ${sale.prescriptionNumber !== '-' ? `<strong>Prescription #:</strong> ${sale.prescriptionNumber}` : ''}
                            </div>
                        </div>
                    </div>
                    
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Batch</th>
                                <th>Qty</th>
                                <th>Price</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${sale.items.map(item => `
                                <tr>
                                    <td>${item.productName}</td>
                                    <td>${item.batchNumber}</td>
                                    <td>${item.quantity}</td>
                                    <td>${currencySymbol}${item.unitPrice.toFixed(2)}</td>
                                    <td>${currencySymbol}${item.total.toFixed(2)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    
                    <div style="text-align: right;">
                        <table style="margin-left: auto; width: 300px;">
                            <tr>
                                <td><strong>Subtotal:</strong></td>
                                <td style="text-align: right;">${currencySymbol}${sale.subtotal.toFixed(2)}</td>
                            </tr>
                            <tr>
                                <td><strong>Discount (${sale.discount}%):</strong></td>
                                <td style="text-align: right; color: #ef4444;">-${currencySymbol}${sale.discountAmount.toFixed(2)}</td>
                            </tr>
                            <tr style="border-top: 2px solid #000;">
                                <td><strong>GRAND TOTAL:</strong></td>
                                <td style="text-align: right;"><strong>${currencySymbol}${sale.grandTotal.toFixed(2)}</strong></td>
                            </tr>
                            <tr>
                                <td><strong>Payment Method:</strong></td>
                                <td style="text-align: right;">${sale.paymentMethod}</td>
                            </tr>
                        </table>
                    </div>
                </div>
            `;
            
            const modal = new bootstrap.Modal(document.getElementById('viewInvoiceModal'));
            modal.show();
        }
        
        function printSaleInvoice() {
            if (!currentViewingSale) return;
            
            const printContent = document.getElementById('printableSaleInvoice').cloneNode(true);
            const printWindow = window.open('', '', 'width=800,height=600');
            
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Invoice - ${currentViewingSale.invoiceNumber}</title>
                    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
                    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
                    <style>
                        body { font-family: 'Inter', Arial, sans-serif; padding: 20px; }
                        @media print { body { padding: 0; } }
                    </style>
                </head>
                <body>${printContent.outerHTML}</body>
                </html>
            `);
            
            printWindow.document.close();
            printWindow.focus();
            setTimeout(() => {
                printWindow.print();
                printWindow.close();
            }, 250);
        }
        
        function resetSalesFilters() {
            document.getElementById('searchSales').value = '';
            document.getElementById('fromDate').value = '';
            document.getElementById('toDate').value = '';
            loadSales();
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            if (!window.location.pathname.includes('sales')) return;
            
            loadSales();
            
            document.getElementById('searchSales')?.addEventListener('input', loadSales);
            document.getElementById('fromDate')?.addEventListener('change', loadSales);
            document.getElementById('toDate')?.addEventListener('change', loadSales);
        });
    </script>
</body>
</html>
