<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - PharmaCare</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-prescription-bottle-alt"></i>
            <span>PharmaCare</span>
        </div>
        <div class="sidebar-menu" id="sidebarMenu"></div>
    </div>

    <div class="main-content">
        <nav class="topbar">
            <button class="btn btn-link sidebar-toggle" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
            
            <div class="topbar-right">
                <div class="dropdown notification-dropdown">
                    <button class="btn btn-link notification-btn" type="button" data-bs-toggle="dropdown">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge" id="notificationBadge">0</span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end notification-menu">
                        <div class="notification-header"><h6>Notifications</h6></div>
                        <div class="notification-list" id="notificationList"></div>
                    </div>
                </div>
                
                <div class="dropdown user-dropdown">
                    <button class="btn btn-link user-btn" type="button" data-bs-toggle="dropdown">
                        <div class="user-avatar"><i class="fas fa-user"></i></div>
                        <div class="user-info">
                            <span class="user-name" id="userName">User</span>
                            <small class="user-role" id="userRole">Role</small>
                        </div>
                        <i class="fas fa-chevron-down ms-2"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="page-content">
            <div class="page-header">
                <h1><i class="fas fa-cog me-2"></i>Settings</h1>
                <p class="text-muted">Configure your pharmacy management system</p>
            </div>

            <form id="settingsForm">
                <!-- Pharmacy Information -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5><i class="fas fa-store me-2"></i>Pharmacy Information</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Pharmacy Name</label>
                                <input type="text" class="form-control" id="pharmacyName">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">NTN / Registration Number</label>
                                <input type="text" class="form-control" id="ntn">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Address</label>
                                <textarea class="form-control" id="address" rows="2"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Phone</label>
                                <input type="text" class="form-control" id="phone">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="email">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Billing Settings -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5><i class="fas fa-file-invoice-dollar me-2"></i>Billing Settings</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Currency</label>
                                <select class="form-select" id="currency">
                                    <option value="USD">USD</option>
                                    <option value="EUR">EUR</option>
                                    <option value="GBP">GBP</option>
                                    <option value="PKR">PKR</option>
                                    <option value="INR">INR</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Currency Symbol</label>
                                <input type="text" class="form-control" id="currencySymbol">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Default Tax (%)</label>
                                <input type="number" class="form-control" id="defaultTax" min="0" max="100">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Invoice Prefix</label>
                                <input type="text" class="form-control" id="invoicePrefix">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Inventory Settings -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5><i class="fas fa-boxes me-2"></i>Inventory Settings</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Low Stock Threshold</label>
                                <input type="number" class="form-control" id="lowStockThreshold" min="1">
                                <small class="text-muted">Alert when stock falls below this level</small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Expiry Warning (Days)</label>
                                <input type="number" class="form-control" id="expiryWarningDays" min="1">
                                <small class="text-muted">Warning when products expire within this period</small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Critical Expiry (Days)</label>
                                <input type="number" class="form-control" id="criticalExpiryDays" min="1">
                                <small class="text-muted">Critical alert for products expiring very soon</small>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-2"></i>Save Settings
                    </button>
                    <button type="button" class="btn btn-outline-secondary" onclick="loadSettings()">
                        <i class="fas fa-undo me-2"></i>Reset
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
    
    <script>
        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('pharmacy_settings') || '{}');
            
            document.getElementById('pharmacyName').value = settings.pharmacyName || '';
            document.getElementById('ntn').value = settings.ntn || '';
            document.getElementById('address').value = settings.address || '';
            document.getElementById('phone').value = settings.phone || '';
            document.getElementById('email').value = settings.email || '';
            document.getElementById('currency').value = settings.currency || 'USD';
            document.getElementById('currencySymbol').value = settings.currencySymbol || '$';
            document.getElementById('defaultTax').value = settings.defaultTax || 5;
            document.getElementById('invoicePrefix').value = settings.invoicePrefix || 'INV';
            document.getElementById('lowStockThreshold').value = settings.lowStockThreshold || 20;
            document.getElementById('expiryWarningDays').value = settings.expiryWarningDays || 30;
            document.getElementById('criticalExpiryDays').value = settings.criticalExpiryDays || 7;
        }

        document.getElementById('settingsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const settings = {
                pharmacyName: document.getElementById('pharmacyName').value,
                ntn: document.getElementById('ntn').value,
                address: document.getElementById('address').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                currency: document.getElementById('currency').value,
                currencySymbol: document.getElementById('currencySymbol').value,
                defaultTax: parseFloat(document.getElementById('defaultTax').value),
                invoicePrefix: document.getElementById('invoicePrefix').value,
                lowStockThreshold: parseInt(document.getElementById('lowStockThreshold').value),
                expiryWarningDays: parseInt(document.getElementById('expiryWarningDays').value),
                criticalExpiryDays: parseInt(document.getElementById('criticalExpiryDays').value)
            };
            
            localStorage.setItem('pharmacy_settings', JSON.stringify(settings));
            
            Swal.fire({
                icon: 'success',
                title: 'Settings Saved',
                text: 'Your settings have been updated successfully',
                timer: 2000,
                showConfirmButton: false
            });
        });

        document.addEventListener('DOMContentLoaded', function() {
            if (!window.location.pathname.includes('settings')) return;
            
            const currentUser = JSON.parse(localStorage.getItem('pharmacy_current_user') || '{}');
            if (currentUser.role !== 'admin') {
                window.location.href = 'dashboard.html';
                return;
            }
            
            loadSettings();
        });
    </script>
</body>
</html>
