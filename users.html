<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - PharmaCare</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-prescription-bottle-alt"></i>
            <span>PharmaCare</span>
        </div>
        <div class="sidebar-menu" id="sidebarMenu"></div>
    </div>

    <div class="main-content">
        <nav class="topbar">
            <button class="btn btn-link sidebar-toggle" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
            
            <div class="topbar-right">
                <div class="dropdown notification-dropdown">
                    <button class="btn btn-link notification-btn" type="button" data-bs-toggle="dropdown">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge" id="notificationBadge">0</span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end notification-menu">
                        <div class="notification-header"><h6>Notifications</h6></div>
                        <div class="notification-list" id="notificationList"></div>
                    </div>
                </div>
                
                <div class="dropdown user-dropdown">
                    <button class="btn btn-link user-btn" type="button" data-bs-toggle="dropdown">
                        <div class="user-avatar"><i class="fas fa-user"></i></div>
                        <div class="user-info">
                            <span class="user-name" id="userName">User</span>
                            <small class="user-role" id="userRole">Role</small>
                        </div>
                        <i class="fas fa-chevron-down ms-2"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="page-content">
            <div class="page-header">
                <div>
                    <h1><i class="fas fa-users me-2"></i>User Management</h1>
                    <p class="text-muted">Manage system users and access</p>
                </div>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
                    <i class="fas fa-plus me-2"></i>Add User
                </button>
            </div>

            <!-- Users Table -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Role</th>
                                    <th>Created</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add User Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="addUserForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Full Name *</label>
                            <input type="text" class="form-control" id="newUserName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email *</label>
                            <input type="email" class="form-control" id="newUserEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password *</label>
                            <input type="password" class="form-control" id="newUserPassword" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="newUserPhone">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role *</label>
                            <select class="form-select" id="newUserRole" required>
                                <option value="shopkeeper">Shopkeeper</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Add User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
    
    <script>
        function loadUsers() {
            const users = JSON.parse(localStorage.getItem('pharmacy_users') || '[]');
            const tbody = document.getElementById('usersTableBody');
            
            tbody.innerHTML = users.map(user => {
                const createdDate = new Date(user.createdAt);
                
                return `
                    <tr>
                        <td><strong>${user.name}</strong></td>
                        <td>${user.email}</td>
                        <td>${user.phone || '-'}</td>
                        <td><span class="badge ${user.role === 'admin' ? 'badge-primary' : 'badge-info'}">${user.role}</span></td>
                        <td>${createdDate.toLocaleDateString()}</td>
                        <td>
                            ${user.active ? 
                                '<span class="badge badge-success">Active</span>' : 
                                '<span class="badge badge-danger">Inactive</span>'}
                        </td>
                        <td>
                            <button class="btn btn-sm btn-${user.active ? 'warning' : 'success'} btn-icon" 
                                    onclick="toggleUserStatus(${user.id})" title="${user.active ? 'Deactivate' : 'Activate'}">
                                <i class="fas fa-${user.active ? 'ban' : 'check'}"></i>
                            </button>
                            <button class="btn btn-sm btn-danger btn-icon" 
                                    onclick="deleteUser(${user.id})" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        document.getElementById('addUserForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const users = JSON.parse(localStorage.getItem('pharmacy_users') || '[]');
            const email = document.getElementById('newUserEmail').value;
            
            // Check if email already exists
            if (users.some(u => u.email === email)) {
                Swal.fire({
                    icon: 'error',
                    title: 'Email Exists',
                    text: 'A user with this email already exists'
                });
                return;
            }
            
            const newUser = {
                id: Math.max(...users.map(u => u.id), 0) + 1,
                name: document.getElementById('newUserName').value,
                email: email,
                password: document.getElementById('newUserPassword').value,
                phone: document.getElementById('newUserPhone').value || '',
                role: document.getElementById('newUserRole').value,
                active: true,
                createdAt: new Date().toISOString()
            };
            
            users.push(newUser);
            localStorage.setItem('pharmacy_users', JSON.stringify(users));
            
            Swal.fire({
                icon: 'success',
                title: 'User Added',
                text: 'User has been added successfully',
                timer: 2000,
                showConfirmButton: false
            });
            
            bootstrap.Modal.getInstance(document.getElementById('addUserModal')).hide();
            document.getElementById('addUserForm').reset();
            loadUsers();
        });

        function toggleUserStatus(userId) {
            const users = JSON.parse(localStorage.getItem('pharmacy_users') || '[]');
            const user = users.find(u => u.id === userId);
            
            if (!user) return;
            
            Swal.fire({
                title: user.active ? 'Deactivate User' : 'Activate User',
                text: `Are you sure you want to ${user.active ? 'deactivate' : 'activate'} ${user.name}?`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#3b82f6'
            }).then((result) => {
                if (result.isConfirmed) {
                    user.active = !user.active;
                    localStorage.setItem('pharmacy_users', JSON.stringify(users));
                    loadUsers();
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'Status Updated',
                        timer: 1500,
                        showConfirmButton: false
                    });
                }
            });
        }

        function deleteUser(userId) {
            Swal.fire({
                title: 'Delete User',
                text: 'Are you sure you want to delete this user? This action cannot be undone.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Yes, delete'
            }).then((result) => {
                if (result.isConfirmed) {
                    let users = JSON.parse(localStorage.getItem('pharmacy_users') || '[]');
                    users = users.filter(u => u.id !== userId);
                    localStorage.setItem('pharmacy_users', JSON.stringify(users));
                    loadUsers();
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'User Deleted',
                        timer: 1500,
                        showConfirmButton: false
                    });
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (!window.location.pathname.includes('users')) return;
            
            const currentUser = JSON.parse(localStorage.getItem('pharmacy_current_user') || '{}');
            if (currentUser.role !== 'admin') {
                window.location.href = 'dashboard.html';
                return;
            }
            
            loadUsers();
        });
    </script>
</body>
</html>
